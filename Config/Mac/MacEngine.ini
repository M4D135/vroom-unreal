; Mac development profile. Keep the RTX desktop budget platform-specific.
[/Script/Engine.RendererSettings]
r.Shadow.Virtual.Enable=0
; TSR coute ~13 ms a 2560x1664 sur M5 (40 i/s en plein ecran). TAA tient 60.
r.AntiAliasingMethod=2

[SystemSettings]
; Profil perf Mac (fluidite d'abord, demande David 7/09) : GI Medium applique
; apres l'init dans VroomGameMode. Resolution interne 70% : Lumen, TAA et
; ombres suivent le nombre de pixels, principal levier anti-saccades.
r.Lumen.Reflections.Allow=0
r.ScreenPercentage=70
r.VSync=1
t.MaxFPS=60
; Procedural components explicitly collect PSOs; prewarm material resources too.
; Keep their proxies deferred until native Metal compilation has completed.
r.PSOPrecaching=1
r.PSOPrecache.Components=1
r.PSOPrecache.Resources=1
r.PSOPrecache.ProxyCreationStrategy=1

[/Script/MacTargetPlatform.MacTargetSettings]
TargetArchitecture=MacTargetArchitectureAppleSilicon
